<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seat Map</title>
<style>
  body{
    margin:0;
    background:#fff;
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
  }
  .bus{
    width:360px;
    padding:30px 15px;
    position:relative;
  }
  .row{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    align-items:center;
    height:95px;
    gap:10px;
  }
  .seat{
    width:52px;
    height:52px;
    position:relative;
    display:flex;
    justify-content:center;
  }
  .seat .icon{
    width:48px;
    height:42px;
    border:2px solid #0B63F6;
    border-top:3px solid #0B63F6;
    border-radius:8px 8px 4px 4px;
    background:#E8F1FF;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:500;
    color:#000;
    position:relative;
  }
  .seat .icon::before, .seat .icon::after{
    content:"";
    position:absolute;
    bottom:-6px;
    width:10px;
    height:18px;
    background:#0B63F6;
    border-radius:2px;
  }
  .seat .icon::before{ left:-2px; }
  .seat .icon
