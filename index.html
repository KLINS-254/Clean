<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>TICOH HOTEL POS — Sign in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <section class="login-card">
      <div class="brand-mark">TH</div>
      <p class="eyebrow">HOSPITALITY MANAGEMENT</p>
      <h1>TICOH HOTEL <span>POS</span></h1>
      <p class="muted">Sign in to manage orders, payments and service.</p>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required placeholder="Enter your username">
        <label for="password">Password</label>
        <div class="password-row">
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password">
          <button type="button" class="eye-btn" id="toggle-password" aria-label="Show password">Show</button>
        </div>
        <button class="btn btn-primary full" type="submit" id="login-btn">Sign in securely</button>
        <p id="login-error" class="error-message" role="alert"></p>
      </form>
      <div class="login-foot">Authorized staff only · Africa/Nairobi</div>
    </section>
  </main>
  <script>
    const form=document.getElementById('login-form');
    document.getElementById('toggle-password').addEventListener('click',()=>{
      const p=document.getElementById('password');
      p.type=p.type==='password'?'text':'password';
      document.getElementById('toggle-password').textContent=p.type==='password'?'Show':'Hide';
    });
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      const btn=document.getElementById('login-btn'),err=document.getElementById('login-error');
      btn.disabled=true;btn.textContent='Signing in…';err.textContent='';
      try{
        const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({username:form.username.value,password:form.password.value})});
        const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not sign in.');
        sessionStorage.setItem('posToken',d.token);location.href='/dashboard.html';
      }catch(e){err.textContent=e.message;}
      finally{btn.disabled=false;btn.textContent='Sign in securely';}
    });
  </script>
</body>
</html>
